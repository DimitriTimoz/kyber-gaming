services:
  kyber-gaming:
    build:
      context: .
      dockerfile: Dockerfile
    image: kyber-gaming:latest
    container_name: kyber-gaming
    restart: unless-stopped
    network_mode: host
    privileged: true

    # Unified WebTransport & HTTP ports, plus dynamic resolution API
    # (Exposed directly on host via network_mode: host: 8080 TCP/UDP, 8081 TCP)
    # ports:
    #   - "8080:8080/tcp"
    #   - "8080:8080/udp"
    #   - "8081:8081/tcp"

    environment:
      - PUID=1000
      - PGID=1000
      - RESOLUTION=1920x1080    # 1920x1080, 2560x1440, 3840x2160
      - REFRESH_RATE=60        # 60, 120, 144
      - LAUNCHER=menu           # Options: menu (default), steam, steam-bigpicture, heroic, browser, desktop
      
      # Authentication (secures streaming controller & Kyber Control Plane API)
      - AUTH_USER=${AUTH_USER:-gamer}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-kybergaming}
      
      # NVIDIA Container Toolkit flags
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    # Privileges required for virtual controllers and real-time audio
    cap_add:
      - SYS_ADMIN
      - SYS_NICE

    # Required for Steam pressure-vessel / bubblewrap user namespaces
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined

    # Device passthrough for virtual and physical inputs
    devices:
      - /dev/uinput:/dev/uinput
      # Uncomment for AMD / Intel GPU passthrough:
      # - /dev/dri:/dev/dri

    # Essential for high framerate games and low-latency buffer sharing
    shm_size: "4gb"
    ipc: host

    # GPU acceleration reservation (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, display]

    volumes:
      # Main persistent user data (Steam, Heroic, emulators, configs, saves, ROMs)
      - gamer_home:/home/gamer
      
      # Optional: Bind-mount local/NAS ROM collections directly:
      # - /mnt/nas/roms:/home/gamer/roms
      
      # TLS certificates for WebTransport / HTTPS (auto-generated if missing)
      - ./kyber_tls:/etc/kyber/tls
      
      # Customizable Launchers & Emulators list for homelab configuration
      - ./config/launchers.json:/etc/kyber/launchers.json:ro
      
      # Direct access to host controllers if plugged into the host
      - /dev/input:/dev/input
      # Udev data so Xorg discovers virtual uinput devices created by kynput
      - /run/udev:/run/udev:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://127.0.0.1:8081/api/launchers >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  gamer_home:
