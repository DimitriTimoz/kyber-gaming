# PipeWire virtual sink configuration for headless cloud gaming
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "KyberAudioSink"
            node.description = "Kyber Virtual Audio Sink"
            media.class      = "Audio/Sink"
            audio.position   = [ "FL", "FR" ]
            monitor.channel-volumes = true
            adapter.auto-port-config = {
                mode = dsp
                monitor = true
                position = preserve
            }
        }
    }
]
