[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus.err.log

[program:xorg]
command=/usr/local/bin/init_display.sh
priority=20
autorestart=true
stdout_logfile=/var/log/supervisor/xorg.log
stderr_logfile=/var/log/supervisor/xorg.err.log

[program:pipewire]
command=/usr/bin/pipewire
user=gamer
environment=HOME="/home/gamer",XDG_RUNTIME_DIR="/run/user/1000",USER="gamer"
priority=30
autorestart=true
stdout_logfile=/var/log/supervisor/pipewire.log
stderr_logfile=/var/log/supervisor/pipewire.err.log

[program:pipewire-pulse]
command=/usr/bin/pipewire-pulse
user=gamer
environment=HOME="/home/gamer",XDG_RUNTIME_DIR="/run/user/1000",USER="gamer"
priority=35
autorestart=true
stdout_logfile=/var/log/supervisor/pipewire-pulse.log
stderr_logfile=/var/log/supervisor/pipewire-pulse.err.log

[program:wireplumber]
command=/usr/bin/wireplumber
user=gamer
environment=HOME="/home/gamer",XDG_RUNTIME_DIR="/run/user/1000",USER="gamer"
priority=40
autorestart=true
stdout_logfile=/var/log/supervisor/wireplumber.log
stderr_logfile=/var/log/supervisor/wireplumber.err.log

[program:openbox]
command=/usr/bin/openbox-session
user=gamer
environment=HOME="/home/gamer",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",USER="gamer"
priority=50
autorestart=true
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err.log

[program:resizer]
command=/usr/bin/python3 /usr/local/bin/resizer_service.py
user=gamer
environment=HOME="/home/gamer",DISPLAY=":0",USER="gamer",RESIZER_PORT="8081"
priority=55
autorestart=true
stdout_logfile=/var/log/supervisor/resizer.log
stderr_logfile=/var/log/supervisor/resizer.err.log

[program:kyber]
command=/usr/local/bin/run_kycontroller.sh
user=gamer
environment=HOME="/home/gamer",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",USER="gamer",KYBER_CONFIG="/etc/kyber/kyber_config.toml",PATH="/opt/kyber/bin:/usr/games:/usr/local/bin:/usr/bin:/bin"
priority=60
autorestart=true
stdout_logfile=/var/log/supervisor/kyber.log
stderr_logfile=/var/log/supervisor/kyber.err.log

[program:launcher]
command=/usr/local/bin/launch_game_session.sh
user=gamer
environment=HOME="/home/gamer",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",USER="gamer",PATH="/usr/games:/usr/local/games:/opt/Heroic:/usr/local/bin:/usr/bin:/bin"
priority=70
autorestart=true
stdout_logfile=/var/log/supervisor/launcher.log
stderr_logfile=/var/log/supervisor/launcher.err.log
