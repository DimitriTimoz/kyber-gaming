Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0" 0 0
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "modesetting"
    Option         "AccelMethod" "glamor"
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    HorizSync       30.0 - 220.0
    VertRefresh     48.0 - 144.0

    # 1920x1080 @ 60Hz
    ModeLine "1920x1080_60.00"  173.00  1920 2048 2248 2576  1080 1083 1088 1120 -hsync +vsync
    # 1920x1080 @ 120Hz
    ModeLine "1920x1080_120.00" 297.00  1920 2008 2052 2200  1080 1084 1089 1125 +hsync +vsync
    # 1920x1080 @ 144Hz
    ModeLine "1920x1080_144.00" 346.50  1920 2008 2052 2200  1080 1084 1089 1094 +hsync +vsync

    # 2560x1440 @ 60Hz
    ModeLine "2560x1440_60.00"  241.50  2560 2720 2992 3424  1440 1443 1448 1481 -hsync +vsync
    # 2560x1440 @ 120Hz
    ModeLine "2560x1440_120.00" 497.75  2560 2736 3008 3456  1440 1443 1448 1500 -hsync +vsync

    # 3840x2160 @ 60Hz
    ModeLine "3840x2160_60.00"  533.25  3840 4016 4104 4256  2160 2168 2178 2222 +hsync -vsync
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    Monitor        "Monitor0"
    DefaultDepth    24
    SubSection "Display"
        Depth       24
        Modes      "1920x1080_60.00" "1920x1080_120.00" "1920x1080_144.00" "2560x1440_60.00" "2560x1440_120.00" "3840x2160_60.00"
    EndSubSection
EndSection
