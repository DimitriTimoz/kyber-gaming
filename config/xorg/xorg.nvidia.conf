Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0" 0 0
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    VendorName     "Kyber"
    ModelName      "KyberDisplay"
    HorizSync       30.0 - 220.0
    VertRefresh     48.0 - 144.0
    Option         "DPMS" "False"
    Option         "Enable" "True"
    Option         "CustomEDID" "DFP-0:/etc/X11/edid.bin"
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    Option         "AllowEmptyInitialConfiguration" "True"
    Option         "UseDisplayDevice" "None"
    Option         "ConnectedMonitor" "DFP-0"
    Option         "CustomEDID" "DFP-0:/etc/X11/edid.bin"
    Option         "HardDPMS" "False"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    Monitor        "Monitor0"
    DefaultDepth    24
    Option         "UseDisplayDevice" "None"
    Option         "ConnectedMonitor" "DFP-0"
    Option         "CustomEDID" "DFP-0:/etc/X11/edid.bin"
    Option         "IgnoreEDID" "False"
    Option         "ModeValidation" "NoMaxPClkCheck, NoEdidMaxPClkCheck, AllowNonEdidModes, NoVertRefreshCheck, NoHorizSyncCheck"
    SubSection "Display"
        Depth       24
        Modes      "1920x1080" "2560x1440" "3840x2160" "1280x720"
    EndSubSection
EndSection
