name: Package Desktop Clients

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop-client/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop-client/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-client:
    name: Build Desktop Client (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os: macos
            args: '--target universal-apple-darwin'
            bundle_path: 'desktop-client/src-tauri/target/universal-apple-darwin/release/bundle'
          - platform: 'ubuntu-22.04'
            os: linux
            args: ''
            bundle_path: 'desktop-client/src-tauri/target/release/bundle'
          - platform: 'windows-latest'
            os: windows
            args: ''
            bundle_path: 'desktop-client/src-tauri/target/release/bundle'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-client/src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install pre-built Tauri CLI via cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm tauri-cli@^2.0.0

      - name: Prepare bundled kyclient sidecar binary
        shell: bash
        run: bash scripts/prepare_kyclient_sidecar.sh ${{ matrix.os }}

      - name: Build Tauri Desktop Client
        working-directory: desktop-client
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kyber-desktop-${{ matrix.os }}
          path: ${{ matrix.bundle_path }}/**
          retention-days: 30

  publish-desktop-release:
    name: Publish Desktop Clients to GitHub Releases
    needs: [build-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: client-artifacts
          pattern: kyber-desktop-*
          merge-multiple: true

      - name: Stage client installers
        shell: bash
        run: |
          mkdir -p release-files
          find client-artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.msi" -o -name "*setup.exe" \) -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create or update Rolling Desktop Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "Kyber Desktop Client (Rolling Release)"
          body: |
            Automated rolling release containing the latest cross-platform Kyber Gaming desktop client installers built from the `main` branch.

            ### Client Installers:
            - **macOS (Universal Apple Silicon & Intel)**: `Kyber Gaming_*_universal.dmg`
            - **Linux (Debian / Ubuntu)**: `Kyber Gaming_*_amd64.deb`
            - **Linux (Standalone AppImage)**: `Kyber Gaming_*_amd64.AppImage`
            - **Linux (Fedora / RHEL)**: `Kyber Gaming-*-1.x86_64.rpm`
            - **Windows (x64 Setup)**: `Kyber Gaming_*_x64-setup.exe`
            - **Windows (x64 MSI)**: `Kyber Gaming_*_x64_en-US.msi`
          files: release-files/*
          prerelease: true
          draft: false
