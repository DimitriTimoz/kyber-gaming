name: Release & Packaging

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-docker:
    name: Build & Publish Release Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-desktop:
    name: Package Desktop Client (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os: macos
            args: '--target universal-apple-darwin'
            bundle_dir: 'desktop-client/src-tauri/target/universal-apple-darwin/release/bundle'
          - platform: 'ubuntu-22.04'
            os: linux
            args: ''
            bundle_dir: 'desktop-client/src-tauri/target/release/bundle'
          - platform: 'windows-latest'
            os: windows
            args: ''
            bundle_dir: 'desktop-client/src-tauri/target/release/bundle'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-client/src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install pre-built Tauri CLI via cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm tauri-cli@^2.0.0

      - name: Prepare bundled kyclient sidecar binary
        shell: bash
        run: bash scripts/prepare_kyclient_sidecar.sh ${{ matrix.os }}

      - name: Build Tauri Desktop Client
        working-directory: desktop-client
        run: cargo tauri build ${{ matrix.args }}

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p dist_release
          if [ "${{ matrix.os }}" = "macos" ]; then
            find ${{ matrix.bundle_dir }} -type f -name "*.dmg" -exec cp {} dist_release/ \;
          elif [ "${{ matrix.os }}" = "linux" ]; then
            find ${{ matrix.bundle_dir }} -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec cp {} dist_release/ \;
          elif [ "${{ matrix.os }}" = "windows" ]; then
            find ${{ matrix.bundle_dir }} -type f \( -name "*.msi" -o -name "*setup.exe" \) -exec cp {} dist_release/ \;
          fi
          ls -la dist_release/

      - name: Upload packaged binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist_release/*
          retention-days: 7

  publish-github-release:
    name: Create GitHub Release with Assets
    needs: [publish-docker, build-desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
